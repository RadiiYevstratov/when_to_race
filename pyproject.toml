[project]
name = "motorsport-schedule-scrapers"
version = "0.1.0"
requires-python = ">=3.12"
description = "Scrapers for a unified motorsport schedule"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
