# Series registry. Adding a championship = one entry here + one module in
# scrapers/sources/. No schema change, no frontend change.
#
# accent_color drives series identity in the UI. Chosen for legibility against
# both the light and dark board backgrounds, and to stay distinguishable from
# each other for the most common forms of colour blindness.
#
# source.adapter maps to a module in scrapers/sources/.
# source.status: "live" = verified endpoint, "unverified" = discovery not yet done.
#   The runner refuses to run an unverified source without --allow-unverified.

[[series]]
code = "f1"
name = "FIA Formula One World Championship"
short_name = "Formula 1"
accent_color = "#E8112D"
sort_order = 10
[series.source]
adapter = "f1"
status = "live"
# The Grand Prix feed carries Formula 1 only.
url = "https://f1.vidmar.net/calendar.ics"
# F2, F3 and F1 Academy are published separately by motorsportcalendars.com,
# the operator behind f1calendar.com (github.com/sportstimes/f1). Each attends
# only part of the season, and their round names do not match the Grand Prix
# names, so the adapter attaches them to a weekend by time. See
# docs/sources.md#formula-1.
extra_urls = [
  "https://files-f2.motorsportcalendars.com/f2-calendar_p_q_sprint_feature.ics",
  "https://files-f3.motorsportcalendars.com/f3-calendar_p_q_sprint_feature.ics",
  "https://files-f1-academy.motorsportcalendars.com/f1-academy-calendar_fp1_fp2_qualifying1_qualifying2_race1_race2_race3.ics",
]
discovery_notes = "docs/sources.md#formula-1"
[[series.categories]]
code = "f1"
name = "FIA Formula One World Championship"
short_name = "F1"
is_headline = true
sort_order = 10
[[series.categories]]
code = "f2"
name = "FIA Formula 2 Championship"
short_name = "F2"
sort_order = 20
[[series.categories]]
code = "f3"
name = "FIA Formula 3 Championship"
short_name = "F3"
sort_order = 30
[[series.categories]]
code = "f1a"
name = "F1 Academy"
short_name = "F1 Academy"
sort_order = 40

[[series]]
code = "wec"
name = "FIA World Endurance Championship"
short_name = "WEC"
accent_color = "#2E9E5B"
sort_order = 20
[series.source]
adapter = "wec"
# fiawec.com per-race pages, parsed from their schema.org JSON-LD (no session
# JSON API exists). Two-stage: season page -> race pages. Same class of
# personal-use Terms as the Dorna sources; set live 2026-08-23 on that basis.
# NOTE: the feed stamps every time with the CMS's own offset, not the circuit's;
# the adapter treats the wall-clock as circuit-local. See docs/sources.md#wec.
status = "live"
url = "https://www.fiawec.com"
discovery_notes = "docs/sources.md#wec"
# Hypercar and LMGT3 run the same sessions, so they are one category. Splitting
# them would duplicate every row in the weekend view for no information gain.
[[series.categories]]
code = "wec"
name = "FIA World Endurance Championship"
short_name = "WEC"
is_headline = true
sort_order = 10

