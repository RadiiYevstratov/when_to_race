[[series]]
code = "indycar"
name = "NTT IndyCar Series"
short_name = "IndyCar"
accent_color = "#0C7C8C"
sort_order = 70
[series.source]
adapter = "indycar"
status = "live"
# The season index. Rounds are read off it and fetched one page each - the site
# is server-rendered with no feed, no API and no embedded JSON, so this is the
# one source here parsed straight from markup.
#
# Every time on the site is published in US Eastern, whatever timezone the
# circuit is in. See docs/sources.md#indycar.
url = "https://www.indycar.com/Schedule"
discovery_notes = "docs/sources.md#indycar"
[[series.categories]]
code = "indycar"
name = "NTT IndyCar Series"
short_name = "IndyCar"
is_headline = true
sort_order = 10
[[series.categories]]
code = "indynxt"
name = "Indy NXT"
short_name = "Indy NXT"
sort_order = 20

[[series]]
code = "nascar"
name = "NASCAR"
short_name = "NASCAR"
accent_color = "#B08A00"
sort_order = 80
[series.source]
adapter = "nascar"
status = "live"
# One request carries the whole season for all three national series. This is
# the feed behind nascar.com's own schedule page.
url = "https://cf.nascar.com/cacher/{season}/race_list_basic.json"
discovery_notes = "docs/sources.md#nascar"
[[series.categories]]
code = "nascar_cup"
name = "NASCAR Cup Series"
short_name = "Cup"
is_headline = true
sort_order = 10
[[series.categories]]
code = "nascar_xfinity"
name = "NASCAR Xfinity Series"
short_name = "Xfinity"
sort_order = 20
[[series.categories]]
code = "nascar_truck"
name = "NASCAR Craftsman Truck Series"
short_name = "Trucks"
sort_order = 30

# ---------------------------------------------------------------------------
# Validation floors. A healthy event for this series has at least this many
# sessions across all categories. Below the floor the run is treated as a
# parser failure, not as a thin race weekend. Deliberately conservative: the
# job is to catch "parser returned 1 session for a Grand Prix", not to police
# unusual calendars.
# ---------------------------------------------------------------------------
[validation.min_sessions_per_event]
f1 = 5
wec = 3
wrc = 3
motogp = 5
wsbk = 4
imsa = 2
indycar = 2
nascar = 1
