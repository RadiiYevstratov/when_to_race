short_name = "WorldSSP"
sort_order = 20
# WorldSSP300 ended after 2024; from 2026 the support classes are World Sportbike
# (SPB) and the Women's championship (WCR). YR3EC (a Yamaha one-make cup) is left
# untracked, like MotoGP's Baggers.
[[series.categories]]
code = "wspb"
name = "FIM World Sportbike Championship"
short_name = "WorldSPB"
sort_order = 30
[[series.categories]]
code = "wcr"
