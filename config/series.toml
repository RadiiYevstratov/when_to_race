[[series]]
code = "motogp"
name = "MotoGP World Championship"
short_name = "MotoGP"
# MotoGP's own class colour is #5F259E. At 2.13:1 against this board it reads
# as a smudge, so what is stored is that violet lifted to 3.56:1 - same hue and
# saturation, enough lightness to survive a 3px rule on near-black.
accent_color = "#8742D3"
sort_order = 40
[series.source]
adapter = "motogp"
# Endpoint discovered and the parser is written and tested (see docs/sources.md
# #motogp). Set live 2026-08-23: the owner accepted the Terms-of-Use risk
# (motogp.com restricts use to "personal purposes"). Documented in sources.md.
status = "live"
url = "https://api.motogp.pulselive.com/motogp/v1/events?seasonYear={season}"
discovery_notes = "docs/sources.md#motogp"
[[series.categories]]
code = "motogp"
name = "MotoGP"
short_name = "MotoGP"
is_headline = true
sort_order = 10
[[series.categories]]
code = "moto2"
name = "Moto2"
short_name = "Moto2"
sort_order = 20
# Moto2's colour is #1C1C1C, which on a near-black board is 1.17:1 - not dim,
# invisible, and indistinguishable from the panel behind it. Its identity is
# achromatic rather than any particular hue, so it is inverted rather than
# lightened: on a dark ground the faithful reading of black is white. No other
# class is neutral, so it stays unmistakably Moto2.
accent_color = "#C9CDD1"
[[series.categories]]
code = "moto3"
name = "Moto3"
short_name = "Moto3"
sort_order = 30
# Moto3's own colour, used exactly as published - 6.02:1, no adjustment needed.
accent_color = "#009BB4"
[[series.categories]]
code = "motoe"
name = "MotoE"
short_name = "MotoE"
sort_order = 40

[[series]]
code = "wsbk"
name = "FIM Superbike World Championship"
short_name = "WorldSBK"
# WorldSBK's own red. Note it sits close to Formula 1's - both are brand
# colours and neither is wrong, so they are left as published; the class name
# on every row is what tells the two apart.
accent_color = "#FE0000"
sort_order = 50
[series.source]
adapter = "wsbk"
# worldsbk.com's own JSON:API (api.wsbk.pulselive.com). Same publisher (Dorna)
# and the same personal-use Terms as MotoGP; set live 2026-08-23 on that basis.
# source.url is the API base; the adapter builds rounds/sessions paths on it.
status = "live"
url = "https://api.wsbk.pulselive.com/wsbk-events/v1"
discovery_notes = "docs/sources.md#worldsbk"
[[series.categories]]
code = "wsbk"
name = "FIM Superbike World Championship"
short_name = "WorldSBK"
is_headline = true
sort_order = 10
[[series.categories]]
code = "wssp"
name = "FIM Supersport World Championship"
short_name = "WorldSSP"
sort_order = 20
# WorldSSP300 ended after 2024; from 2026 the support classes are World Sportbike
# (SPB) and the Women's championship (WCR). YR3EC (a Yamaha one-make cup) is left
# untracked, like MotoGP's Baggers.
# WorldSSP's own green, exactly as published.
accent_color = "#00D200"
[[series.categories]]
code = "wspb"
name = "FIM World Sportbike Championship"
short_name = "WorldSPB"
sort_order = 30
# WorldSPB's own orange, exactly as published.
accent_color = "#FF7800"
[[series.categories]]
code = "wcr"
name = "FIM Women's Circuit Racing World Championship"
short_name = "WorldWCR"
sort_order = 40

# WorldWCR's own yellow, exactly as published.
accent_color = "#FED100"
