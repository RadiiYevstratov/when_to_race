# Series registry. Adding a championship = one entry here + one module in
# scrapers/sources/. No schema change, no frontend change.
#
# accent_color drives series identity in the UI. Chosen for legibility against
# both the light and dark board backgrounds, and to stay distinguishable from
# each other for the most common forms of colour blindness.
#
# source.adapter maps to a module in scrapers/sources/.
# source.status: "live" = verified endpoint, "unverified" = discovery not yet done.
#   The runner refuses to run an unverified source without --allow-unverified.

[[series]]
code = "f1"
name = "FIA Formula One World Championship"
short_name = "Formula 1"
accent_color = "#E8112D"
sort_order = 10
[series.source]
adapter = "f1"
status = "live"
# The Grand Prix feed carries Formula 1 only.
url = "https://f1.vidmar.net/calendar.ics"
# F2 and F3 come from their own championships' calendars. These are season
# indexes, not feeds: the adapter reads the round links out of each and then
# fetches one page per round. Which rounds a support championship attends
# changes from season to season, so the list is never written down here.
#
# A community ICS covering both was used first and was wrong by up to seven
# hours per session, in no consistent direction. See docs/sources.md#formula-1.
extra_urls = [
  "https://www.fiaformula2.com/en/racing/{season}",
  "https://www.fiaformula3.com/en/racing/{season}",
  # F1 Academy runs on a different platform and puts its whole season, sessions
  # included, in one page's __NEXT_DATA__ - so this one is fetched directly
  # rather than expanded into per-round pages.
  "https://www.f1academy.com/Racing-Series/Calendar",
]
discovery_notes = "docs/sources.md#formula-1"
[[series.categories]]
code = "f1"
name = "FIA Formula One World Championship"
short_name = "F1"
is_headline = true
sort_order = 10
[[series.categories]]
code = "f2"
name = "FIA Formula 2 Championship"
short_name = "F2"
sort_order = 20
# Formula 2's own brand blue.
accent_color = "#0096D6"
[[series.categories]]
code = "f3"
name = "FIA Formula 3 Championship"
short_name = "F3"
sort_order = 30
# Formula 3's own brand orange.
accent_color = "#E35205"
[[series.categories]]
code = "f1a"
name = "F1 Academy"
short_name = "F1 Academy"
sort_order = 40

# F1 Academy's 2026 identity is electric purple with hot pink accents. The
# purple was too near MotoGP's own violet to tell apart on a mixed board, so
# this takes the pink half instead - still theirs, and magenta is the one hue
# no other class occupies. The exact value is ours; they publish no hex.
accent_color = "#FF3B9A"
[[series]]
code = "wec"
name = "FIA World Endurance Championship"
short_name = "WEC"
accent_color = "#2E9E5B"
sort_order = 20
[series.source]
adapter = "wec"
# fiawec.com per-race pages, parsed from their schema.org JSON-LD (no session
# JSON API exists). Two-stage: season page -> race pages. Same class of
# personal-use Terms as the Dorna sources; set live 2026-08-23 on that basis.
# NOTE: the feed stamps every time with the CMS's own offset, not the circuit's;
# the adapter treats the wall-clock as circuit-local. See docs/sources.md#wec.
status = "live"
url = "https://www.fiawec.com"
discovery_notes = "docs/sources.md#wec"
# Hypercar and LMGT3 run the same sessions, so they are one category. Splitting
# them would duplicate every row in the weekend view for no information gain.
[[series.categories]]
code = "wec"
name = "FIA World Endurance Championship"
short_name = "WEC"
is_headline = true
sort_order = 10

[[series]]
code = "wrc"
name = "FIA World Rally Championship"
short_name = "WRC"
accent_color = "#C86A00"
sort_order = 30
[series.source]
adapter = "wrc"
status = "unverified"
discovery_notes = "docs/sources.md#wrc"
[[series.categories]]
code = "wrc"
name = "FIA World Rally Championship"
short_name = "WRC"
is_headline = true
sort_order = 10
[[series.categories]]
code = "wrc2"
