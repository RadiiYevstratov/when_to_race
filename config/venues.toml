# Venue registry. iana_timezone is mandatory and load-bearing: every official
# source publishes session times in circuit-local time, and a hardcoded UTC
# offset is wrong on every DST boundary.
#
# Deliberately included edge cases, kept as regression fixtures:
#   america/phoenix          - never observes DST
#   america/indiana/indianapolis - DST rules changed in 2006, distinct zone
#   asia/kolkata             - +05:30, non-hour offset
#   australia/melbourne      - southern hemisphere, DST inverted vs Europe
#   africa/nairobi           - +03, no DST
#
# Coordinates are approximate and used only for the optional map link. The
# timezone is the field that must be right.

